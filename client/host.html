<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#4338ca" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/assets/icons/icon.svg" type="image/svg+xml" />
  <title>QUIZÓN — Panel Anfitrión</title>
  <link rel="stylesheet" href="/css/global.css" />
  <link rel="stylesheet" href="/css/host.css" />
</head>
<body class="host-body">
  <header class="host-header">
    <div>
      <strong style="font-size: 1.3rem;">🎛️ QUIZ<span style="color: var(--gold);">ÓN</span> Anfitrión</strong>
      <div id="host-room-label" style="font-size: 0.85rem; color: var(--text-muted);">Sin sala vinculada</div>
    </div>
    <div style="display: flex; align-items: center; gap: 0.6rem;">
      <a href="/admin" target="_blank" rel="noopener" class="btn btn-ghost" style="padding: 0.4rem 0.75rem; font-size: 0.85rem;">
        🛠️ Editor
      </a>
      <span id="host-state-badge" class="badge">Desconectado</span>
    </div>
  </header>

  <!-- VINCULAR TV -->
  <section id="h-view-claim" class="card">
    <h2 style="margin-bottom: 0.6rem;">Vincular con la TV</h2>
    <p style="color: var(--text-muted); margin-bottom: 1rem; font-size: 0.95rem;">
      Abre <strong>/tv</strong> en la televisión e introduce el código de 6 dígitos que aparece en pantalla.
    </p>
    <div class="form-group">
      <label for="host-input-code">Código de sala (6 dígitos)</label>
      <input id="host-input-code" type="tel" maxlength="6" placeholder="123456" inputmode="numeric" />
    </div>
    <button id="btn-claim-room" class="btn btn-success btn-lg" type="button">Tomar el control de la TV</button>
  </section>

  <!-- CONFIGURACIÓN EN LOBBY -->
  <section id="h-view-lobby" class="host-section hidden">
    <div class="card">
      <h2 style="margin-bottom: 1rem;">Configuración de Partida</h2>
      <div class="form-group">
        <label for="cfg-title">Nombre de la partida</label>
        <input id="cfg-title" type="text" maxlength="50" value="Noche de QUIZÓN" />
      </div>
      <div class="form-group">
        <label for="cfg-pack">Pack de preguntas</label>
        <select id="cfg-pack"></select>
      </div>
      <div class="form-group">
        <label for="cfg-count">Número de preguntas</label>
        <input id="cfg-count" type="number" min="1" max="50" value="10" />
      </div>
      <div class="form-group">
        <label for="cfg-time-mult">Factor multiplicador de tiempo: <strong id="cfg-time-mult-label" style="color: var(--gold);">1.0x</strong></label>
        <input id="cfg-time-mult" type="range" min="0.5" max="3" step="0.25" value="1" />
      </div>
      <div class="checkbox-row">
        <input id="cfg-auto" type="checkbox" />
        <label for="cfg-auto">Avance automático entre rondas</label>
      </div>
      <div class="checkbox-row">
        <input id="cfg-late" type="checkbox" checked />
        <label for="cfg-late">Permitir entrada tardía de equipos</label>
      </div>
      <button id="btn-save-config" class="btn btn-ghost" type="button" style="width: 100%; margin-top: 0.4rem;">
        Guardar configuración
      </button>
    </div>

    <div class="card">
      <h3 style="margin-bottom: 0.7rem;">Equipos conectados (<span id="host-team-count">0</span>)</h3>
      <div id="host-teams-list" style="display: flex; flex-direction: column; gap: 0.5rem;"></div>
    </div>

    <button id="btn-start-game" class="btn btn-success btn-lg" type="button">🚀 Iniciar Concurso</button>
  </section>

  <!-- CONTROL EN PARTIDA -->
  <section id="h-view-live" class="host-section hidden">
    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.6rem;">
        <span id="live-progress" class="badge gold">Pregunta 1 / 10</span>
        <span id="live-answered" class="badge">0 / 0 respuestas</span>
      </div>
      <p id="live-prompt" style="font-size: 1.05rem; font-weight: 600;"></p>
    </div>

    <div class="host-controls-grid">
      <button id="btn-end-timer" class="btn btn-danger hidden" type="button" style="grid-column: span 2;">
        ⏹️ Finalizar tiempo
      </button>
      <button id="btn-reveal-answer" class="btn btn-success hidden" type="button" style="grid-column: span 2;">
        💡 Mostrar solución
      </button>
      <button id="btn-show-results" class="btn btn-success hidden" type="button" style="grid-column: span 2;">
        📊 Ver resultados
      </button>
      <button id="btn-next-step" class="btn btn-success hidden" type="button" style="grid-column: span 2;">
        ⏭️ Siguiente pregunta
      </button>
      <button id="btn-pause-toggle" class="btn btn-warning" type="button">⏸️ Pausar</button>
      <button id="btn-finish-now" class="btn btn-danger" type="button">🏁 Finalizar</button>
    </div>

    <button id="btn-play-again" class="btn btn-success btn-lg hidden" type="button">
      🔄 Nueva partida (mismos equipos)
    </button>
  </section>

  <!-- AUDIO TV -->
  <section id="h-audio-card" class="card hidden">
    <h3 style="margin-bottom: 0.6rem;">🔊 Audio de la Televisión</h3>
    <div class="audio-row">
      <button id="btn-tv-mute" class="btn btn-ghost" type="button">Silenciar</button>
      <input id="range-tv-volume" type="range" min="0" max="1" step="0.05" value="0.8" />
    </div>
  </section>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="/js/host.js"></script>
</body>
</html>
