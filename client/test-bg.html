<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QUIZÓN — Prueba de Fondo en Bucle</title>
  <link rel="stylesheet" href="/css/global.css" />
  <link rel="stylesheet" href="/css/animations.css" />
  <link rel="stylesheet" href="/css/tv.css" />
  <style>
    .bg-stage {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      background: #060918;
    }

    .bg-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 1.2s ease, filter 0.3s ease;
      transform: scale(1);
    }

    .bg-layer.ken-burns {
      animation: kenBurnsZoom 10s ease-in-out infinite alternate;
    }

    @keyframes kenBurnsZoom {
      from { transform: scale(1); }
      to { transform: scale(1.08); }
    }

    .bg-scrim {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(9, 13, 31, 0.35), rgba(9, 13, 31, 0.85));
      pointer-events: none;
    }

    .tv-header,
    .tv-main {
      position: relative;
      z-index: 1;
    }

    /* Panel flotante de ajustes */
    .tuner-panel {
      position: fixed;
      bottom: 1rem;
      right: 1rem;
      width: 320px;
      z-index: 50;
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      padding: 1rem;
      backdrop-filter: blur(12px);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.55);
      font-size: 0.88rem;
    }

    .tuner-panel.collapsed .tuner-body {
      display: none;
    }

    .tuner-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.6rem;
    }

    .tuner-row {
      margin-bottom: 0.65rem;
    }

    .tuner-row label {
      display: flex;
      justify-content: space-between;
      margin-bottom: 0.2rem;
      font-size: 0.82rem;
    }

    .tuner-btns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.45rem;
      margin-top: 0.5rem;
    }

    .tuner-btns .btn {
      padding: 0.55rem 0.7rem;
      font-size: 0.85rem;
    }

    .tv-clue-box {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0.25rem auto 0.5rem;
      padding: 0.5rem;
      background: rgba(9, 13, 31, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 16px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
      max-width: 720px;
      width: 100%;
    }

    .tv-clue-box img {
      max-height: 260px;
      max-width: 100%;
      object-fit: contain;
      border-radius: 10px;
      display: block;
    }
  </style>
</head>
<body class="tv-body">
  <!-- Fondo multicapa en bucle -->
  <div class="bg-stage">
    <img id="bg-layer-a" class="bg-layer ken-burns" alt="" />
    <img id="bg-layer-b" class="bg-layer ken-burns" alt="" />
    <div id="bg-scrim" class="bg-scrim"></div>
  </div>

  <header class="tv-header">
    <div class="tv-brand">📺 QUIZ<span>ÓN</span> <small style="font-size: 0.95rem; color: var(--text-muted);">· Boceto Fondo de Imágenes</small></div>
    <div class="tv-room-pill">
      <span id="bg-status-badge" class="badge gold">bg · 1 / 3</span>
    </div>
  </header>

  <main class="tv-main">
    <section class="tv-question-layout">
      <div id="q-timer-wrap" class="tv-timer-wrap">
        <span id="q-category-badge" class="badge">Naturaleza y Mitos</span>
        <div class="tv-timer-bar"><div class="tv-timer-fill" style="width: 72%;"></div></div>
        <div class="tv-timer-seconds">18</div>
        <span class="badge gold">1 / 3 equipos</span>
      </div>

      <h2 id="q-prompt-text" class="tv-question-prompt">Cargando pregunta...</h2>

      <div id="q-clue-box" class="tv-clue-box hidden">
        <img id="q-clue-img" alt="Imagen de pista" />
      </div>

      <div id="q-options-grid" class="tv-options-grid"></div>

      <div id="q-reveal-box" class="tv-reveal-box hidden">
        <div>
          <strong style="color: #4ade80; font-size: 1.15rem; display: block; margin-bottom: 0.35rem;">💡 Explicación</strong>
          <p id="q-explanation-text"></p>
          <div id="q-extra-fact" class="tv-extra-fact"></div>
        </div>
      </div>
    </section>
  </main>

  <!-- Panel de ajustes en vivo -->
  <aside id="tuner-panel" class="tuner-panel">
    <div class="tuner-head">
      <strong>🎛️ Ajustes de Fondo</strong>
      <button id="btn-toggle-panel" class="btn btn-ghost" type="button" style="padding: 0.25rem 0.6rem; font-size: 0.8rem;">Ocultar</button>
    </div>
    <div class="tuner-body">
      <div class="tuner-row">
        <label>Catálogo (6d) / Pregunta (5d)</label>
        <div style="display: flex; gap: 0.4rem;">
          <input id="inp-catalog-id" type="text" value="000001" maxlength="6" style="padding: 0.45rem 0.5rem; font-size: 0.85rem; width: 44%;" />
          <input id="inp-question-id" type="text" value="00001" maxlength="5" style="padding: 0.45rem 0.5rem; font-size: 0.85rem; width: 34%;" />
          <button id="btn-load-question" class="btn btn-ghost" type="button" style="padding: 0.45rem 0.65rem; font-size: 0.85rem;">Cargar</button>
        </div>
      </div>

      <div class="tuner-btns" style="margin-bottom: 0.7rem;">
        <button id="btn-phase-bg" class="btn" type="button">Pregunta (bg)</button>
        <button id="btn-phase-explain" class="btn btn-ghost" type="button">Solución (explain)</button>
      </div>

      <div class="tuner-row">
        <label>Duración por imagen <span id="val-interval">4.0s</span></label>
        <input id="rng-interval" type="range" min="1.5" max="10" step="0.5" value="4" />
      </div>

      <div class="tuner-row">
        <label>Transición (crossfade) <span id="val-fade">1.4s</span></label>
        <input id="rng-fade" type="range" min="0.2" max="3" step="0.2" value="1.4" />
      </div>

      <div class="tuner-row">
        <label>Opacidad de imagen <span id="val-opacity">0.65</span></label>
        <input id="rng-opacity" type="range" min="0.15" max="0.95" step="0.05" value="0.65" />
      </div>

      <div class="tuner-row">
        <label>Oscurecimiento del velo <span id="val-scrim">0.15</span></label>
        <input id="rng-scrim" type="range" min="0.1" max="0.9" step="0.05" value="0.15" />
      </div>

      <div class="tuner-row">
        <label>Desenfoque (blur) <span id="val-blur">0px</span></label>
        <input id="rng-blur" type="range" min="0" max="10" step="1" value="0" />
      </div>

      <div class="checkbox-row" style="margin-bottom: 0.4rem;">
        <input id="chk-kenburns" type="checkbox" checked />
        <label for="chk-kenburns" style="font-size: 0.85rem;">Zoom lento (Ken Burns)</label>
      </div>

      <div id="file-label" style="font-size: 0.78rem; color: var(--text-muted); margin-bottom: 0.4rem; word-break: break-all;"></div>

      <div style="border-top: 1px solid var(--border-subtle); margin: 0.55rem 0; padding-top: 0.55rem;">
        <div class="tuner-row">
          <label>Volumen audio <span id="val-audio-vol">0.05</span></label>
          <input id="rng-audio-vol" type="range" min="0" max="1" step="0.01" value="0.05" />
        </div>
        <div class="tuner-row">
          <label>Fade-in audio <span id="val-audio-fadein">2.0s</span></label>
          <input id="rng-audio-fadein" type="range" min="0" max="4" step="0.2" value="2.0" />
        </div>
        <div class="tuner-row">
          <label>Fade-out audio <span id="val-audio-fadeout">2.0s</span></label>
          <input id="rng-audio-fadeout" type="range" min="0" max="4" step="0.2" value="2.0" />
        </div>
        <div id="audio-status" style="font-size: 0.78rem; color: var(--text-muted); margin-bottom: 0.35rem; word-break: break-all;"></div>
        <audio id="bg-audio" controls loop class="hidden" style="width: 100%; height: 32px; margin-bottom: 0.4rem;"></audio>
        <div id="audio-fade-btns" class="tuner-btns hidden" style="margin-top: 0; margin-bottom: 0.5rem;">
          <button id="btn-audio-fadein" class="btn btn-ghost" type="button">🔊 Fade-In</button>
          <button id="btn-audio-fadeout" class="btn btn-ghost" type="button">🔇 Fade-Out</button>
        </div>
      </div>

      <div class="tuner-btns">
        <button id="btn-pause-loop" class="btn btn-warning" type="button">⏸️ Pausar</button>
        <button id="btn-next-img" class="btn btn-ghost" type="button">⏭️ Siguiente</button>
      </div>
    </div>
  </aside>

  <script type="module">
    const layerA = document.getElementById('bg-layer-a');
    const layerB = document.getElementById('bg-layer-b');
    const scrim = document.getElementById('bg-scrim');
    const statusBadge = document.getElementById('bg-status-badge');
    const fileLabel = document.getElementById('file-label');

    const clueBox = document.getElementById('q-clue-box');
    const clueImg = document.getElementById('q-clue-img');
    const bgAudioEl = document.getElementById('bg-audio');
    const audioFadeBtns = document.getElementById('audio-fade-btns');

    let mediaData = { bg: [], clue: [], explain: [], audio: { bg: [], clue: [], explain: [] } };
    let phase = 'bg';
    let currentIndex = 0;
    let activeLayer = 'a';
    let loopTimer = null;
    let paused = false;
    let audioFadeRaf = null;

    const cfg = {
      intervalMs: 4000,
      fadeSec: 1.4,
      opacity: 0.65,
      scrim: 0.15,
      blur: 0,
      kenBurns: true,
      audioVol: 0.05,
      audioFadeIn: 2.0,
      audioFadeOut: 2.0,
    };

    function fadeAudioTo(targetVol, durationSec, onDone) {
      if (audioFadeRaf) {
        cancelAnimationFrame(audioFadeRaf);
        audioFadeRaf = null;
      }
      const startVol = bgAudioEl.volume;
      const clampedTarget = Math.max(0, Math.min(1, targetVol));
      if (durationSec <= 0.05) {
        bgAudioEl.volume = clampedTarget;
        if (onDone) onDone();
        return;
      }
      const startTime = performance.now();
      const durationMs = durationSec * 1000;
      const step = (now) => {
        const t = Math.min(1, (now - startTime) / durationMs);
        bgAudioEl.volume = Math.max(0, Math.min(1, startVol + (clampedTarget - startVol) * t));
        if (t < 1) {
          audioFadeRaf = requestAnimationFrame(step);
        } else {
          audioFadeRaf = null;
          if (onDone) onDone();
        }
      };
      audioFadeRaf = requestAnimationFrame(step);
    }

    function applyVisualSettings() {
      [layerA, layerB].forEach((el) => {
        el.style.transition = `opacity ${cfg.fadeSec}s ease, filter 0.3s ease`;
        el.style.filter = `blur(${cfg.blur}px)`;
        el.classList.toggle('ken-burns', cfg.kenBurns);
      });
      const currentEl = activeLayer === 'a' ? layerA : layerB;
      if (currentEl.src) {
        currentEl.style.opacity = String(cfg.opacity);
      }
      scrim.style.background = `radial-gradient(circle at center, rgba(9, 13, 31, ${(cfg.scrim * 0.65).toFixed(2)}), rgba(9, 13, 31, ${Math.min(0.95, cfg.scrim + 0.25).toFixed(2)}))`;
    }

    function updateClueBox() {
      const clues = mediaData.clue || [];
      if (phase === 'bg' && clues.length > 0) {
        const clueItem = clues[currentIndex % clues.length];
        clueImg.src = clueItem.url;
        clueBox.classList.remove('hidden');
      } else {
        clueBox.classList.add('hidden');
      }
    }

    function showImageAt(idx) {
      const list = mediaData[phase] || [];
      updateClueBox();
      if (!list.length) {
        layerA.style.opacity = '0';
        layerB.style.opacity = '0';
        statusBadge.textContent = `${phase} · sin imágenes`;
        fileLabel.textContent = 'Sin archivos para esta fase';
        return;
      }

      currentIndex = ((idx % list.length) + list.length) % list.length;
      const item = list[currentIndex];

      const incoming = activeLayer === 'a' ? layerB : layerA;
      const outgoing = activeLayer === 'a' ? layerA : layerB;
      activeLayer = activeLayer === 'a' ? 'b' : 'a';

      incoming.src = item.url;
      requestAnimationFrame(() => {
        incoming.style.opacity = String(cfg.opacity);
        outgoing.style.opacity = '0';
      });

      statusBadge.textContent = `${phase} · ${currentIndex + 1} / ${list.length}`;
      fileLabel.textContent = `Archivo: ${item.name}`;
    }

    function restartLoop() {
      if (loopTimer) clearInterval(loopTimer);
      if (paused) return;
      loopTimer = setInterval(() => {
        showImageAt(currentIndex + 1);
      }, cfg.intervalMs);
    }

    function renderQuestion(question) {
      const catEl = document.getElementById('q-category-badge');
      const promptEl = document.getElementById('q-prompt-text');
      const gridEl = document.getElementById('q-options-grid');
      const expEl = document.getElementById('q-explanation-text');
      const factEl = document.getElementById('q-extra-fact');

      catEl.textContent = question.category || 'Pregunta';
      promptEl.textContent = question.prompt || '';

      const letters = ['A', 'B', 'C', 'D', 'E', 'F'];
      const optClasses = ['opt-a', 'opt-b', 'opt-c', 'opt-d'];

      let optionsList = [];
      let correctIndex = -1;

      if (question.type === 'true_false') {
        optionsList = ['Verdadero', 'Falso'];
        correctIndex = question.answer === true ? 0 : 1;
      } else if (Array.isArray(question.options)) {
        optionsList = question.options;
        correctIndex = typeof question.correctIndex === 'number'
          ? question.correctIndex
          : (typeof question.answer === 'number' ? question.answer : 0);
      }

      gridEl.innerHTML = '';
      optionsList.forEach((text, i) => {
        const div = document.createElement('div');
        div.className = `tv-option ${optClasses[i % optClasses.length]}`;
        div.dataset.correct = String(i === correctIndex);
        div.innerHTML = `
          <div class="tv-option-main">
            <div class="tv-option-letter">${letters[i] || String(i + 1)}</div>
            <div></div>
          </div>
        `;
        div.querySelector('.tv-option-main > div:last-child').textContent = text;
        gridEl.appendChild(div);
      });

      expEl.textContent = question.explanation || '';
      if (question.extraFact) {
        factEl.textContent = `✨ Curiosidad: ${question.extraFact}`;
        factEl.classList.remove('hidden');
      } else {
        factEl.textContent = '';
        factEl.classList.add('hidden');
      }
    }

    async function loadQuestionAndMedia(questionId, catalogOverride) {
      let catalogId = catalogOverride || document.getElementById('inp-catalog-id').value.trim() || '000001';
      try {
        const qRes = await fetch(`/api/preview-question/${encodeURIComponent(questionId)}`);
        if (qRes.ok) {
          const qData = await qRes.json();
          if (qData.catalogId) {
            catalogId = qData.catalogId;
            document.getElementById('inp-catalog-id').value = catalogId;
          }
          if (qData.question) {
            renderQuestion(qData.question);
          }
        }
      } catch (_err) {
        // Si falla la carga de pregunta, intentamos cargar igualmente las imágenes
      }

      const res = await fetch(`/api/media/${encodeURIComponent(catalogId)}/${encodeURIComponent(questionId)}`);
      mediaData = res.ok ? await res.json() : { bg: [], clue: [], explain: [] };
      setPhase(phase);
    }

    function setPhase(newPhase) {
      phase = newPhase;
      const isExplain = phase === 'explain';
      document.getElementById('btn-phase-bg').className = isExplain ? 'btn btn-ghost' : 'btn';
      document.getElementById('btn-phase-explain').className = isExplain ? 'btn' : 'btn btn-ghost';
      document.getElementById('q-timer-wrap').classList.toggle('hidden', isExplain);
      document.getElementById('q-reveal-box').classList.toggle('hidden', !isExplain);
      document.getElementById('q-options-grid').classList.toggle('reveal-focused', isExplain);
      document.querySelectorAll('#q-options-grid .tv-option').forEach((el) => {
        const ok = el.dataset.correct === 'true';
        el.classList.toggle('correct-highlight', isExplain && ok);
        el.classList.toggle('dimmed', isExplain && !ok);
        el.classList.toggle('collapsed', isExplain && !ok);
      });
      currentIndex = 0;
      const audioStatusEl = document.getElementById('audio-status');
      const phaseAudio = mediaData.audio?.[phase]?.[0];
      if (!mediaData.audio) {
        audioStatusEl.textContent = '⚠️ Reinicia el servidor (npm start) para activar el soporte de audio';
        bgAudioEl.classList.add('hidden');
        audioFadeBtns.classList.add('hidden');
      } else if (phaseAudio?.url) {
        bgAudioEl.src = phaseAudio.url;
        bgAudioEl.classList.remove('hidden');
        audioFadeBtns.classList.remove('hidden');
        audioStatusEl.textContent = `🎵 ${phaseAudio.name}`;
        bgAudioEl.volume = 0;
        bgAudioEl
          .play()
          .then(() => fadeAudioTo(cfg.audioVol, cfg.audioFadeIn))
          .catch(() => {
            bgAudioEl.volume = cfg.audioVol;
            audioStatusEl.textContent = `🔇 Haz clic en la página o en Play para oír ${phaseAudio.name}`;
            const unlockPlay = () => {
              if (!bgAudioEl.src || !bgAudioEl.paused) return;
              bgAudioEl.volume = 0;
              bgAudioEl
                .play()
                .then(() => {
                  audioStatusEl.textContent = `🎵 ${phaseAudio.name}`;
                  fadeAudioTo(cfg.audioVol, cfg.audioFadeIn);
                })
                .catch(() => {});
            };
            document.addEventListener('pointerdown', unlockPlay, { once: true });
          });
      } else {
        audioStatusEl.textContent = `Sin audio en fase ${phase}`;
        fadeAudioTo(0, cfg.audioFadeOut, () => {
          bgAudioEl.pause();
          bgAudioEl.removeAttribute('src');
          bgAudioEl.classList.add('hidden');
          audioFadeBtns.classList.add('hidden');
        });
      }
      showImageAt(0);
      restartLoop();
    }

    // Bind controles
    document.getElementById('btn-toggle-panel').addEventListener('click', () => {
      const p = document.getElementById('tuner-panel');
      const collapsed = p.classList.toggle('collapsed');
      document.getElementById('btn-toggle-panel').textContent = collapsed ? 'Mostrar' : 'Ocultar';
    });

    document.getElementById('btn-load-question').addEventListener('click', () => {
      const catId = document.getElementById('inp-catalog-id').value.trim() || '000001';
      const qId = document.getElementById('inp-question-id').value.trim() || '00001';
      loadQuestionAndMedia(qId, catId);
    });

    document.getElementById('btn-phase-bg').addEventListener('click', () => setPhase('bg'));
    document.getElementById('btn-phase-explain').addEventListener('click', () => setPhase('explain'));

    document.getElementById('rng-audio-vol').addEventListener('input', (e) => {
      cfg.audioVol = Number(e.target.value);
      document.getElementById('val-audio-vol').textContent = cfg.audioVol.toFixed(2);
      if (!bgAudioEl.paused) bgAudioEl.volume = cfg.audioVol;
    });

    document.getElementById('rng-audio-fadein').addEventListener('input', (e) => {
      cfg.audioFadeIn = Number(e.target.value);
      document.getElementById('val-audio-fadein').textContent = `${cfg.audioFadeIn.toFixed(1)}s`;
    });

    document.getElementById('rng-audio-fadeout').addEventListener('input', (e) => {
      cfg.audioFadeOut = Number(e.target.value);
      document.getElementById('val-audio-fadeout').textContent = `${cfg.audioFadeOut.toFixed(1)}s`;
    });

    document.getElementById('btn-audio-fadein').addEventListener('click', () => {
      if (!bgAudioEl.src) return;
      bgAudioEl.volume = 0;
      bgAudioEl.play().then(() => fadeAudioTo(cfg.audioVol, cfg.audioFadeIn)).catch(() => {});
    });

    document.getElementById('btn-audio-fadeout').addEventListener('click', () => {
      fadeAudioTo(0, cfg.audioFadeOut, () => bgAudioEl.pause());
    });

    document.getElementById('rng-interval').addEventListener('input', (e) => {
      cfg.intervalMs = Number(e.target.value) * 1000;
      document.getElementById('val-interval').textContent = `${Number(e.target.value).toFixed(1)}s`;
      restartLoop();
    });

    document.getElementById('rng-fade').addEventListener('input', (e) => {
      cfg.fadeSec = Number(e.target.value);
      document.getElementById('val-fade').textContent = `${cfg.fadeSec.toFixed(1)}s`;
      applyVisualSettings();
    });

    document.getElementById('rng-opacity').addEventListener('input', (e) => {
      cfg.opacity = Number(e.target.value);
      document.getElementById('val-opacity').textContent = cfg.opacity.toFixed(2);
      applyVisualSettings();
    });

    document.getElementById('rng-scrim').addEventListener('input', (e) => {
      cfg.scrim = Number(e.target.value);
      document.getElementById('val-scrim').textContent = cfg.scrim.toFixed(2);
      applyVisualSettings();
    });

    document.getElementById('rng-blur').addEventListener('input', (e) => {
      cfg.blur = Number(e.target.value);
      document.getElementById('val-blur').textContent = `${cfg.blur}px`;
      applyVisualSettings();
    });

    document.getElementById('chk-kenburns').addEventListener('change', (e) => {
      cfg.kenBurns = e.target.checked;
      applyVisualSettings();
    });

    document.getElementById('btn-pause-loop').addEventListener('click', () => {
      paused = !paused;
      document.getElementById('btn-pause-loop').textContent = paused ? '▶️ Reanudar' : '⏸️ Pausar';
      restartLoop();
    });

    document.getElementById('btn-next-img').addEventListener('click', () => {
      showImageAt(currentIndex + 1);
      restartLoop();
    });

    applyVisualSettings();
    loadQuestionAndMedia('00001', '000001');
  </script>
</body>
</html>
